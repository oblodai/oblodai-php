name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, curl
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      # No backend checkout here: the conformance suite runs against the vendored snapshot in
      # contract/ (`make ci` locally also checks that snapshot and the generated code are current).
      - run: vendor/bin/phpunit --testsuite unit,contract,conformance

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: json, curl
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer lint
      - run: composer stan
